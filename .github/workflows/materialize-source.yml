name: Materialize Freya source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > source.tar.gz.b64
          base64 -d source.tar.gz.b64 > source.tar.gz
          tar -xzf source.tar.gz
          rm -rf bootstrap source.tar.gz source.tar.gz.b64

          mkdir -p public/downloads
          (
            cd apps/extension
            zip -qr ../../public/downloads/freya-bridge-1.1.6.zip .
          )

      - name: Commit materialized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Materialize Freya Inbox source"
          git push
